name: cd

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: ["dev"]

concurrency:
  group: cd-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build jar (skip tests)
        run: ./gradlew clean bootJar -x test

      - name: Prepare app.jar for Docker
        run: |
          cp build/libs/*.jar app.jar
          ls -al app.jar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (latest + sha)
        run: |
          IMAGE_BASE=ghcr.io/${{ github.repository_owner }}/blankspace
          SHA=${GITHUB_SHA::7}

          docker build -t $IMAGE_BASE:latest -t $IMAGE_BASE:sha-$SHA .
          docker push $IMAGE_BASE:latest
          docker push $IMAGE_BASE:sha-$SHA

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy on EC2 via SSM
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" \
            --comment "Deploying commit ${{ github.sha }}" \
            --parameters commands="cd /home/ec2-user && ./deploy.sh" \
            --timeout-seconds 600