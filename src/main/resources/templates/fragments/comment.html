<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div class="commentMenu flex flex-column gap-lg"
th:fragment="commentMenu(targetType, targetId)"
th:attr="data-target-type=${targetType}, data-target-id=${targetId}"
th:data-is-auth="${#authorization.expression('isAuthenticated()')}"
th:data-is-admin="${#authorization.expression('hasRole(''ADMIN'')')}">
    <p class="title2Text bold">댓글 <span class="navy1">00</span></p>
    <form class="commentForm flex flex-column gap-xs" id="commentForm" sec:authorize="isAuthenticated()">
        <p class="title3Text bold">댓글 작성하기</p>
        <textarea class="commentInput" id="commentInput" placeholder="500자 이내, 등록 후 수정이 불가합니다."></textarea>
        <button type="button" class="btn" onclick="subComment()">등록</button>
    </form>
    <div class="commentList"></div>
    <div class="pages flex justify-center gap-sm" data-pagination></div>
</div>
</html>
