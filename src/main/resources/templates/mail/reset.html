<body style="margin:0;padding:0;background:#F4F6F7;">

      <!-- 컨테이너 -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600"
             style="width:600px;max-width:600px;border:1px solid #34495E;background:#FAFAF8;">
        <!-- 헤더바 -->
        <tr>
          <td style="background:#34495E;height:40px;line-height:40px;padding:0 16px;">
              <span style="font-family:Arial, Helvetica, sans-serif;font-size:18px;color:#FAFAF8;font-weight:700;">
                BLANKSPACE · 비밀번호 재설정
              </span>
          </td>
        </tr>

        <!-- 본문 -->

              • 임시 비밀번호: <b>{{TEMP_PASSWORD}}</b>
            </div>

        <!-- 안내 문구 -->

          <td style="padding:12px 20px 0 20px;">
            <div style="font-family:Arial, Helvetica, sans-serif;font-size:14px;color:#24292F;line-height:1.6;">

            </div>
          </td>
        </tr>

        <!-- 버튼 -->
        <tr>

              버튼이 동작하지 않으면 아래 링크를 주소창에 입력하세요.

            <div style="word-break:break-all;margin-top:6px;">

        <tr>
